name: Compile Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out ScopeOne
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            subversion \
            build-essential \
            cmake \
            autoconf \
            automake \
            libtool \
            autoconf-archive \
            pkg-config \
            libboost-all-dev \
            ninja-build curl zip unzip \
            libgl-dev libegl-dev libopengl-dev libx11-dev libx11-xcb-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-util-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb-xinput-dev \
            libxcb-glx0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/scopeone-vcpkg"
          git -C "$RUNNER_TEMP/scopeone-vcpkg" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$RUNNER_TEMP/scopeone-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/scopeone-vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-scopeone-ubuntu-24.04-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-scopeone-ubuntu-24.04-

      - name: Compile mmCoreAndDevices and ScopeOne
        shell: bash
        run: ./scripts/build-unix.sh

  compile-windows:
    name: Compile (Windows)
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      # Keep in sync with windows-release.yml
      MMCORE_COMMIT: 212cc416eec291634c916078a31efd4c5f914c64

    steps:
      - name: Check out ScopeOne
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:RUNNER_TEMP\scopeone-vcpkg"
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout $baseline
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $binaryCache = "$env:RUNNER_TEMP\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-scopeone-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-scopeone-x64-windows-

      - name: Build MMCore
        shell: pwsh
        run: |
          $mm = "$env:GITHUB_WORKSPACE\ScopeOneCore\external\mmCoreAndDevices"
          git init $mm
          git -C $mm fetch --depth 1 https://github.com/micro-manager/mmCoreAndDevices.git $env:MMCORE_COMMIT
          git -C $mm checkout FETCH_HEAD
          msbuild "$mm\MMCore\MMCore.vcxproj" /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$mm\" /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Building MMCore failed." }
          if (-not (Test-Path "$mm\build\Release\x64\MMCore.lib")) { throw "MMCore.lib was not produced." }

      - name: Compile Core, plugins and GUI
        shell: pwsh
        run: |
          .\scripts\build.ps1 --configure `
            --pluginConfigureOption -DSCOPEONE_ENABLE_CUDA=OFF `
            --pluginConfigureOption -DSCOPEONE_ENABLE_INFERENCE=OFF
