name: Compile Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out ScopeOne
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            subversion \
            build-essential \
            cmake \
            autoconf \
            automake \
            libtool \
            autoconf-archive \
            pkg-config \
            libboost-all-dev \
            qt6-base-dev \
            libopencv-dev \
            libtiff-dev \
            zlib1g-dev

      - name: Compile mmCoreAndDevices and ScopeOne
        shell: bash
        run: ./scripts/build-linux.sh
