name: Compile Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out ScopeOne
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            autoconf \
            automake \
            libtool \
            autoconf-archive \
            pkg-config \
            libboost-all-dev \
            ninja-build curl zip unzip \
            libegl-dev libopengl-dev libx11-xcb-dev libxrender-dev \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-util-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xinput-dev libxcb-glx0-dev \
            libxkbcommon-x11-dev

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/scopeone-vcpkg"
          git -C "$RUNNER_TEMP/scopeone-vcpkg" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$RUNNER_TEMP/scopeone-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/scopeone-vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-scopeone-ubuntu-24.04-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-scopeone-ubuntu-24.04-

      - name: Compile mmCoreAndDevices and ScopeOne
        shell: bash
        run: ./scripts/build.sh

  compile-installed-qt:
    name: Compile (Linux, installed Qt 6.8)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out ScopeOne
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            autoconf \
            automake \
            libtool \
            autoconf-archive \
            pkg-config \
            libboost-all-dev \
            ninja-build curl zip unzip \
            libegl-dev libopengl-dev libx11-xcb-dev libxrender-dev \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-util-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xinput-dev libxcb-glx0-dev \
            libxkbcommon-x11-dev

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/scopeone-vcpkg"
          git -C "$RUNNER_TEMP/scopeone-vcpkg" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$RUNNER_TEMP/scopeone-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/scopeone-vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-scopeone-ubuntu-24.04-installed-qt-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-scopeone-ubuntu-24.04-installed-qt-

      # The oldest Qt that ScopeOne supports, so a newer Qt API used by mistake fails here
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          cache: true

      - name: Compile mmCoreAndDevices and ScopeOne
        shell: bash
        run: ./scripts/build.sh --qt "$QT_ROOT_DIR"

  compile-macos:
    name: Compile (macOS)
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Check out ScopeOne
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          brew install \
            git cmake autoconf automake libtool autoconf-archive \
            pkg-config ninja boost

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/scopeone-vcpkg"
          git -C "$RUNNER_TEMP/scopeone-vcpkg" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$RUNNER_TEMP/scopeone-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/scopeone-vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-scopeone-macos-15-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-scopeone-macos-15-

      - name: Compile mmCoreAndDevices and ScopeOne
        shell: bash
        run: ./scripts/build.sh

  compile-windows:
    name: Compile (Windows)
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Check out ScopeOne
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSVC
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:RUNNER_TEMP\scopeone-vcpkg"
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout $baseline
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $binaryCache = "$env:RUNNER_TEMP\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-scopeone-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-scopeone-x64-windows-

      # build.ps1 clones the latest mmCoreAndDevices and builds MMCore
      - name: Compile MMCore, Core, drivers and GUI
        shell: pwsh
        run: |
          .\scripts\build.ps1 --configure `
            --coreConfigureOption -DSCOPEONE_ENABLE_CUDA=OFF
