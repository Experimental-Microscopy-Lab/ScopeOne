# Cobolt Jive (05-01 series) on a serial port
# Linux: /dev/ttyUSB0 or /dev/ttyACM0, macOS: /dev/cu.usbserial-..., Windows: COM3
ScopeOneDevice,Laser561,cobolt-05-01,Laser
ScopeOneProperty,Laser561,Port,COM17
ScopeOneProperty,Laser561,BaudRate,115200

# Preset: Laser
ScopeOneConfigGroup,Laser,Off,Laser561,Laser,Off
